name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 3 días (margen seguro frente a la pausa de 7 días)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer consulta a Supabase
        run: |
          curl -i --fail-with-body -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}"